name: "🐛 Bug Report"
description: "Report an issue or unexpected behavior in Context Sync"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Context Sync Version / Commit
      description: What version or git commit of Context Sync are you running?
      placeholder: "e.g. v1.0.0 or commit hash"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI Coding Agent Involved
      description: Which agent were you using when the issue occurred?
      options:
        - Cursor IDE
        - Claude Desktop
        - Claude Code CLI
        - OpenAI Codex CLI
        - Google Antigravity
        - Windsurf IDE
        - Cline (VS Code)
        - Roo Code (VS Code)
        - Web UI / REST API
        - Auto-Sync Daemon
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 / 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu / Debian)
        - Docker
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Please copy and paste any relevant terminal output or docker logs.
      render: shell
